function bind(){const c=CONTENT[lang];let store={};const key='the-body-story-zh-v1';try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){store={}};const save=()=>{localStorage.setItem(key,JSON.stringify(store));progress()};document.querySelectorAll('[data-save]').forEach(el=>{const k=lang+'-'+el.dataset.save;if(store[k]!=null)el.value=store[k];el.addEventListener('input',()=>{store[k]=el.value;save()})});document.querySelectorAll('[data-savecheck]').forEach(el=>{const k=lang+'-check-'+el.dataset.savecheck;if(store[k]!=null)el.checked=!!store[k];el.addEventListener('change',()=>{store[k]=el.checked;save()})});document.querySelectorAll('[data-taggroup] .tag').forEach(btn=>{const k=lang+'-tag-'+btn.textContent.trim();if(store[k])btn.classList.add('active');btn.addEventListener('click',()=>{btn.classList.toggle('active');store[k]=btn.classList.contains('active');save()})});document.querySelectorAll('input[name="neutral"]').forEach(r=>{if(store[lang+'-neutral']===r.value)r.checked=true;r.addEventListener('change',()=>{if(r.checked){store[lang+'-neutral']=r.value;save()}})});const pressure=document.getElementById('pressure'),out=document.getElementById('pressureOut');out.textContent=pressure.value;pressure.addEventListener('input',()=>out.textContent=pressure.value);function progress(){const f=[...document.querySelectorAll('[data-save]')];const d=f.filter(x=>String(x.value).trim()).length;document.getElementById('doneCount').textContent=d;document.getElementById('totalCount').textContent=f.length;const p=f.length?Math.round(d/f.length*100):0;document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressFab').textContent=p+'% '+c.progress}progress();document.getElementById('saveNow').addEventListener('click',()=>{save();const b=document.getElementById('saveNow'),old=b.textContent;b.textContent=lang==='hans'?'已保存':'已儲存';setTimeout(()=>b.textContent=old,1000)});document.getElementById('printBtn').addEventListener('click',()=>window.print
